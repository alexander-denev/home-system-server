name: home-system-server

networks:
    default:
        name: home-system-server

services:
    proxyman:
        # Default login details:
        # Email:    admin@example.com
        # Password: changeme
        image: jc21/nginx-proxy-manager:latest
        ports:
            - "80:80" # Public HTTP Port
            - "443:443" # Public HTTPS Port
            - "8080:81" # Admin Web Interface Port
        restart: unless-stopped
        volumes:
            - ./config/proxyman/data:/data
            - ./config/proxyman/letsencrypt:/etc/letsencrypt
        healthcheck:
            test: ["CMD", "/usr/bin/check-health"]
            timeout: 5s
            retries: 3
            interval: 10s
            start_interval: 5s

    homarr:
        image: ghcr.io/homarr-labs/homarr:latest
        # ports:
        # - '7575:7575' # Web Interface
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock # Optional, only if you want docker integration
            - ./config/homarr:/appdata
        restart: unless-stopped
        environment:
            - SECRET_ENCRYPTION_KEY=${SECRET_ENCRYPTION_KEY}

    watchtower:
        image: containrrr/watchtower
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
        restart: unless-stopped
        environment:
            - TZ=${TZ} # Timezone
            - WATCHTOWER_SCHEDULE=0 0 4 * * * # Run every day at 4am

    wireguard:
        image: ghcr.io/wg-easy/wg-easy
        volumes:
            - ./config/wireguard:/etc/wireguard
        ports:
            - "51820:51820/udp"
            # - "51821:51821/tcp" # Web Interface
        restart: unless-stopped
        cap_add:
            - NET_ADMIN
            - SYS_MODULE
            # - NET_RAW # ⚠️ Uncomment if using Podman
        sysctls:
            - net.ipv4.ip_forward=1
            - net.ipv4.conf.all.src_valid_mark=1
        environment:
            # Change Language:
            # (Supports: en, ua, ru, tr, no, pl, fr, de, ca, es, ko, vi, nl, is, pt, chs, cht, it, th, hi)
            - LANG=en
            # ⚠️ Required:
            # Change this to your host's public address
            - WG_HOST=vpn.${STACK_HOST}

            # Optional:
            # - PASSWORD=foobar123 (deprecated, see readme)
            # - PASSWORD_HASH=$$2y$$10$$hBCoykrB95WSzuV4fafBzOHWKu9sbyVa34GJr8VV5R/pIelfEMYyG (needs double $$, hash of 'foobar123'; see "How_to_generate_an_bcrypt_hash.md" for generate the hash)
            # - PORT=51821
            # - WG_PORT=51820
            # - WG_CONFIG_PORT=92820
            # - WG_DEFAULT_ADDRESS=10.8.0.x
            # - WG_DEFAULT_DNS=192.168.0.2
            # - WG_MTU=1420
            # - WG_ALLOWED_IPS=192.168.15.0/24, 10.0.1.0/24
            # - WG_PERSISTENT_KEEPALIVE=25
            # - WG_PRE_UP=echo "Pre Up" > /etc/wireguard/pre-up.txt
            # - WG_POST_UP=echo "Post Up" > /etc/wireguard/post-up.txt
            # - WG_PRE_DOWN=echo "Pre Down" > /etc/wireguard/pre-down.txt
            # - WG_POST_DOWN=echo "Post Down" > /etc/wireguard/post-down.txt
            # - UI_TRAFFIC_STATS=true
            # - UI_CHART_TYPE=0 # (0 Charts disabled, 1 # Line chart, 2 # Area chart, 3 # Bar chart)

    portainer:
        image: portainer/portainer-ce:latest
        # ports:
        #     - "9443:9443" # Web Interface
        restart: unless-stopped
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - ./config/portainer:/data

    portainer_agent:
        # We run a portainer agent due to the fact, that portainer alone cannot browse volumes. This is a workaround.
        image: portainer/agent:latest
        # ports:
        #     - 9001:9001 # Communication Port
        restart: unless-stopped
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - /var/lib/docker/volumes:/var/lib/docker/volumes

    n8n:
        image: n8nio/n8n:latest
        # ports:
            # - 5678:5678 # Web Interface
        restart: unless-stopped
        volumes:
            - ./config/n8n:/home/node/.n8n
        environment:
            - TZ=${TZ} # System timezone
            - GENERIC_TIMEZONE=${TZ} # Timezone for nodes like Schedule
            - N8N_HOST=n8n.${STACK_HOST}
            - N8N_PORT=5678
